name: Build macOS App

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --draft --title "$TAG" --generate-notes
          fi

  build:
    name: Build ${{ matrix.arch }}
    needs: [prepare-release]
    if: ${{ !cancelled() && (needs.prepare-release.result == 'success' || needs.prepare-release.result == 'skipped') }}
    permissions:
      contents: write
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    steps:
      - name: Checkout source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Run tests
        run: swift test

      - name: Build and package app
        run: ./build_app.sh

      - name: Verify bundle
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          plutil -lint MacDLNA.app/Contents/Info.plist
          codesign --verify --deep --strict --verbose=2 MacDLNA.app
          lipo MacDLNA.app/Contents/MacOS/MacDLNA -verify_arch "$EXPECTED_ARCH"

      - name: Archive app
        env:
          ARCH: ${{ matrix.arch }}
        run: ditto -c -k --sequesterRsrc --keepParent MacDLNA.app "MacDLNA-macos-${ARCH}.zip"

      - name: Upload release asset
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          ARCH: ${{ matrix.arch }}
        run: gh release upload "$TAG" "MacDLNA-macos-${ARCH}.zip" --clobber

  publish-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --draft=false
